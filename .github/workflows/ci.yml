name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert the model was never downloaded during this run
        run: |
          if ! git diff --quiet -- public/vendor/face_landmarker.task; then
            echo "The committed model changed during the build — vendoring should have been a no-op."
            exit 1
          fi
          echo "Model came from the repo, not the network."
